<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ef5c41" />
    <title>DH KM 加载页预览</title>
    <link rel="icon" href="./icon-512.png" type="image/png" />
    <style>
      :root {
        --bg-a: #f26146;
        --bg-b: #ef5b40;
        --bg-c: #eb553c;
        --text: rgba(255, 249, 246, 0.96);
        --text-soft: rgba(255, 244, 239, 0.76);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 26px calc(38px + env(safe-area-inset-bottom, 0px));
        background:
          radial-gradient(circle at 50% 72%, rgba(255, 220, 210, 0.3), transparent 18%),
          radial-gradient(circle at 50% 16%, rgba(255, 244, 239, 0.08), transparent 26%),
          linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%);
        overflow: hidden;
      }

      .splash-card {
        width: min(100%, 430px);
        min-height: calc(100dvh - 56px - env(safe-area-inset-bottom, 0px));
        max-height: calc(100dvh - 56px - env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        text-align: center;
      }

      .splash-copy {
        padding-top: max(18px, env(safe-area-inset-top, 0px));
        width: 100%;
      }

      .splash-intro {
        margin: 0 0 18px;
        font-size: 12px;
        letter-spacing: 0.28em;
        color: rgba(255, 246, 241, 0.52);
        animation: splashRise 480ms ease both;
      }

      .splash-slogan {
        margin: 0;
        font-size: clamp(40px, 12vw, 72px);
        line-height: 1.1;
        color: var(--text);
        font-family: "STXingkai", "Kaiti SC", "KaiTi", cursive;
        font-weight: 400;
        text-shadow: 0 10px 26px rgba(169, 48, 28, 0.16);
        animation: splashRise 720ms ease both;
        max-width: 360px;
        margin-left: auto;
        margin-right: auto;
      }

      .splash-stage {
        position: relative;
        width: 100%;
        min-height: clamp(320px, 42dvh, 520px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 12px;
        flex: 1;
      }

      .splash-blob {
        position: absolute;
        border-radius: 999px;
        filter: blur(4px);
        opacity: 0.88;
      }

      .splash-blob-a {
        top: 54px;
        left: 58px;
        width: clamp(120px, 34vw, 178px);
        height: clamp(120px, 34vw, 178px);
        background: linear-gradient(180deg, rgba(255, 190, 76, 0.92), rgba(255, 131, 0, 0.9));
        border-top-left-radius: 110px;
        border-top-right-radius: 110px;
        border-bottom-left-radius: 150px;
        border-bottom-right-radius: 40px;
      }

      .splash-blob-b {
        top: 62px;
        right: 40px;
        width: clamp(128px, 34vw, 182px);
        height: clamp(150px, 38vw, 208px);
        background: linear-gradient(180deg, rgba(26, 24, 34, 0.95), rgba(43, 40, 55, 0.96));
        border-top-left-radius: 140px;
        border-top-right-radius: 140px;
        border-bottom-left-radius: 42px;
        border-bottom-right-radius: 126px;
        transform: rotate(12deg);
      }

      .splash-blob-c {
        bottom: 42px;
        left: 28px;
        width: clamp(154px, 46vw, 214px);
        height: clamp(92px, 26vw, 138px);
        background: linear-gradient(180deg, rgba(22, 20, 29, 0.94), rgba(44, 40, 57, 0.98));
        border-top-left-radius: 42px;
        border-top-right-radius: 170px;
        border-bottom-left-radius: 160px;
        border-bottom-right-radius: 40px;
        transform: rotate(-7deg);
      }

      .splash-pulse-ring {
        position: absolute;
        width: clamp(214px, 58vw, 288px);
        height: clamp(214px, 58vw, 288px);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 246, 242, 0.28), rgba(255, 246, 242, 0) 68%);
        animation: splashRing 2.3s ease-in-out infinite;
      }

      .splash-shadow {
        position: absolute;
        left: 50%;
        bottom: 34px;
        width: clamp(180px, 58vw, 256px);
        height: clamp(28px, 8vw, 38px);
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(157, 38, 26, 0.34);
        filter: blur(16px);
      }

      .splash-visual-shell {
        position: relative;
        z-index: 2;
        width: clamp(210px, 66vw, 292px);
        height: clamp(210px, 66vw, 292px);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateY(8px);
      }

      .splash-visual {
        position: relative;
        width: clamp(172px, 54vw, 236px);
        height: clamp(172px, 54vw, 236px);
        border-radius: clamp(44px, 14vw, 64px);
        overflow: hidden;
        box-shadow: 0 28px 60px rgba(132, 34, 24, 0.24);
        animation: splashPulse 2.1s ease-in-out infinite;
      }

      .splash-visual img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .splash-visual::after {
        content: "";
        position: absolute;
        inset: -10%;
        background: linear-gradient(110deg, transparent 34%, rgba(255, 255, 255, 0.32) 50%, transparent 66%);
        transform: translateX(-120%) rotate(8deg);
        animation: splashScan 1.9s ease-in-out infinite;
      }

      .splash-motion {
        position: absolute;
        z-index: 1;
        display: grid;
        gap: 12px;
      }

      .splash-motion span {
        display: block;
        width: 72px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 246, 241, 0.84);
        animation: motionFlicker 1.8s ease-in-out infinite;
      }

      .splash-motion-left {
        left: 38px;
        bottom: 104px;
      }

      .splash-motion-left span:first-child {
        width: 46px;
        justify-self: end;
      }

      .splash-motion-right {
        right: 34px;
        bottom: 110px;
      }

      .splash-motion-right span:last-child {
        width: 42px;
        justify-self: end;
      }

      .splash-note {
        position: absolute;
        z-index: 1;
        color: rgba(255, 250, 247, 0.94);
        text-shadow: 0 8px 18px rgba(153, 44, 34, 0.18);
        animation: noteFloat 2.8s ease-in-out infinite;
      }

      .splash-note-one {
        top: 76px;
        left: 28%;
        font-size: clamp(28px, 8vw, 44px);
        animation-delay: 0s;
      }

      .splash-note-two {
        top: 124px;
        right: 18%;
        font-size: clamp(22px, 6vw, 34px);
        animation-delay: 0.45s;
      }

      .splash-note-three {
        top: 182px;
        right: 16%;
        font-size: clamp(28px, 7vw, 42px);
        animation-delay: 0.9s;
      }

      .splash-footer {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        margin-top: auto;
      }

      .splash-brand {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        animation: splashRise 840ms ease both;
      }

      .splash-brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 18px rgba(160, 46, 28, 0.16);
      }

      .splash-brand-mark img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .splash-brand-name {
        margin: 0;
        font-size: clamp(20px, 6vw, 28px);
        line-height: 1;
        color: var(--text);
        letter-spacing: 0.04em;
      }

      .splash-loader {
        position: relative;
        width: min(320px, 76vw);
        height: 14px;
        margin-bottom: 0;
      }

      .splash-loader-track,
      .splash-loader-fill {
        position: absolute;
        inset: 0;
        border-radius: 999px;
      }

      .splash-loader-track {
        background: rgba(255, 247, 243, 0.34);
      }

      .splash-loader-fill {
        width: 100%;
        background: linear-gradient(
          90deg,
          rgba(255, 250, 247, 0),
          rgba(255, 250, 247, 0.96) 22%,
          rgba(255, 250, 247, 0.96) 78%,
          rgba(255, 250, 247, 0)
        );
        animation: loaderSweep 1.8s ease-in-out infinite;
      }

      @keyframes splashPulse {
        0%,
        100% {
          transform: scale(0.97) translateY(0);
        }

        50% {
          transform: scale(1) translateY(-4px);
        }
      }

      @keyframes splashRing {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.36;
        }

        50% {
          transform: scale(1.06);
          opacity: 0.74;
        }
      }

      @keyframes splashScan {
        0% {
          transform: translateX(-130%) rotate(8deg);
          opacity: 0;
        }

        20% {
          opacity: 0.95;
        }

        70% {
          opacity: 0.82;
        }

        100% {
          transform: translateX(130%) rotate(8deg);
          opacity: 0;
        }
      }

      @keyframes motionFlicker {
        0%,
        100% {
          opacity: 0.45;
          transform: translateX(0);
        }

        50% {
          opacity: 1;
          transform: translateX(6px);
        }
      }

      @keyframes noteFloat {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }

        50% {
          transform: translateY(-10px) rotate(4deg);
        }
      }

      @keyframes loaderSweep {
        0% {
          transform: scaleX(0.74);
          opacity: 0.74;
        }

        50% {
          transform: scaleX(1);
          opacity: 1;
        }

        100% {
          transform: scaleX(0.74);
          opacity: 0.74;
        }
      }

      @keyframes splashRise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 420px) {
        .splash-card {
          min-height: calc(100dvh - 44px - env(safe-area-inset-bottom, 0px));
          max-height: calc(100dvh - 44px - env(safe-area-inset-bottom, 0px));
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-card">
      <div class="splash-copy">
        <p class="splash-intro">DH KM 助理</p>
        <h1 class="splash-slogan">关注什么<br />成为什么</h1>
      </div>

      <div class="splash-stage" aria-hidden="true">
        <div class="splash-blob splash-blob-a"></div>
        <div class="splash-blob splash-blob-b"></div>
        <div class="splash-blob splash-blob-c"></div>

        <span class="splash-note splash-note-one">♪</span>
        <span class="splash-note splash-note-two">♩</span>
        <span class="splash-note splash-note-three">♫</span>

        <div class="splash-pulse-ring"></div>
        <div class="splash-shadow"></div>
        <div class="splash-visual-shell">
          <div class="splash-visual">
            <img src="./icon-512.png" alt="DH KM 助理图标" />
          </div>
        </div>
      </div>

      <div class="splash-footer">
        <div class="splash-brand">
          <div class="splash-brand-mark">
            <img src="./icon-192.png" alt="DH KM 助理图标" />
          </div>
          <p class="splash-brand-name">DH KM 助理</p>
        </div>
      </div>
    </div>
  </body>
</html>
